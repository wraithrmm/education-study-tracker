services:
  tracker:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8080"   # bound to loopback: reach it through the tunnel, not the LAN
    volumes:
      - tracker-data:/data
    environment:
      PORT: 8080
      DB_PATH: /data/tracker.db
      # Must be the exact public HTTPS origin, no trailing slash.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      TRACKER_PASSWORD: ${TRACKER_PASSWORD:?set TRACKER_PASSWORD in .env}
      # "false" puts the dashboard behind the same bearer token as the API.
      DASHBOARD_PUBLIC: ${DASHBOARD_PUBLIC:-true}

volumes:
  tracker-data:
