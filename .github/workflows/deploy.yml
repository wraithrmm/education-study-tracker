name: Deploy

# Merging into main is the release. workflow_dispatch is there for a re-deploy
# without an empty commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys rsyncing into the same directory would interleave. Queue them,
# and never cancel one midway — a half-copied release is worse than a late one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'education.rmmann.co.uk' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'edtrackerpaige' }}
  # The domain's document root, relative to the SSH user's home. This is where
  # DreamHost points the domain by default; the service is a front-controller
  # PHP app, so it needs no separate public/ directory and no Passenger.
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'education.rmmann.co.uk' }}
  SHARED_DIR: ${{ vars.SHARED_DIR || 'tracker-shared' }}
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://education.rmmann.co.uk' }}
  DASHBOARD_PUBLIC: ${{ vars.DASHBOARD_PUBLIC || 'true' }}

jobs:
  deploy:
    name: Verify, ship and confirm
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          php -v | head -1
          find php -name '*.php' -print0 | xargs -0 -n1 php -l

      # Boots the service on PHP's own server and walks the full connector
      # handshake and every MCP tool. A broken build never reaches the server.
      - name: Smoke test
        run: bash deploy/smoke-test.sh
      # The Spanish scoreboard has to reproduce the app's view exactly, so it
      # is a golden snapshot: render it against a fixed fixture and fail on any
      # diff. Also covers the practice arithmetic, the idempotency key and the
      # topic rollup rule.
      - name: Practice acceptance tests and golden snapshots
        run: php deploy/practice-test.php

      - name: Check required secrets are present
        env:
          SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          TRACKER_PASSWORD: ${{ secrets.TRACKER_PASSWORD }}
        run: |
          missing=
          [ -n "$SSH_PASSWORD" ] || missing="$missing DEPLOY_SSH_PASSWORD"
          [ -n "$TRACKER_PASSWORD" ] || missing="$missing TRACKER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see DEPLOYMENT.md" >&2
            exit 1
          fi

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Ship the release
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          TRACKER_PASSWORD: ${{ secrets.TRACKER_PASSWORD }}
        run: bash deploy/ship.sh

      # PHP is served per request, so there is no process to restart and no
      # warm-up: the very next request runs the new code.
      - name: Verify the live service
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/health.body"
          for attempt in $(seq 1 12); do
            code="$(curl -s -o "$BODY" -w '%{http_code}' --max-time 30 "$PUBLIC_URL/healthz" || echo 000)"
            if [ "$code" = 200 ] && grep -q '"ok":true' "$BODY"; then
              echo "healthz: $(cat "$BODY")"
              {
                echo "### Deployed to [$PUBLIC_URL]($PUBLIC_URL)"
                echo ''
                echo "\`healthz\` → \`$(cat "$BODY")\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt/12: HTTP $code"
            if [ "$attempt" -ge 3 ] && grep -qE 'has not yet uploaded their website|is almost here' "$BODY"; then
              echo "--- response body (first 400 bytes) ---"; head -c 400 "$BODY"; echo
              echo "::error::The domain is serving the DreamHost placeholder, so the deploy landed somewhere the web server does not read. Check DEPLOY_DIR against the domain's web directory in the panel." >&2
              exit 1
            fi
            sleep 10
          done
          echo "--- last response body (first 800 bytes) ---"; head -c 800 "$BODY"; echo
          echo "::error::$PUBLIC_URL/healthz never returned ok — see DEPLOYMENT.md, 'When a deploy fails'" >&2
          exit 1

      # The live handshake, read-only: discovery documents, the dashboards, and
      # the 401 challenge Claude needs to find the authorisation server.
      - name: Verify the connector handshake against production
        run: BASE="$PUBLIC_URL" bash deploy/smoke-test.sh --remote

      - name: Diagnose a failed deploy
        if: failure()
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set -uo pipefail
          SSH='sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30'
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          echo "=============== what the origin serves ==============="
          for path in /healthz /; do
            echo "--- GET $PUBLIC_URL$path"
            curl -s -o "$RUNNER_TEMP/d.body" -D "$RUNNER_TEMP/d.head" -w 'status %{http_code}\n' \
              --max-time 30 "$PUBLIC_URL$path" || echo "request failed"
            grep -iE '^(HTTP/|server:|content-type:|location:)' "$RUNNER_TEMP/d.head" || true
            head -c 400 "$RUNNER_TEMP/d.body"; echo
          done

          echo "=============== the deploy directory ==============="
          $SSH "$TARGET" "ls -la \"\$HOME/$DEPLOY_DIR\" 2>&1 | head -20; echo '--- php'; php -v 2>&1 | head -1" || true

          echo "=============== apache log ==============="
          $SSH "$TARGET" "tail -30 \"\$HOME/logs/$DEPLOY_DIR/https/error.log\" 2>/dev/null" || true
