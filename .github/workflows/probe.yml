name: Probe

# A scratch SSH terminal on the deploy host. Runs on pushes to working
# branches only, never on main, and never as part of a release. Delete this
# workflow once the hosting question is settled.
on:
  push:
    branches: ['claude/**']

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    name: Inspect the deploy host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run the diagnostic sweep
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'education.rmmann.co.uk' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'edtrackerpaige' }}
        run: |
          set -uo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::DEPLOY_SSH_PASSWORD is not set"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/probe-remote.sh 2>&1
          echo "sweep exit: $?"

          echo
          echo "########## fetching the PHP probes over HTTPS"
          for path in /probe-php.php /probe-route/hello; do
            echo "--- GET https://$DEPLOY_HOST$path"
            curl -s -o /tmp/p.body -w 'status %{http_code}\n' --max-time 30 "https://$DEPLOY_HOST$path"
            head -c 400 /tmp/p.body; echo
          done

          echo
          echo "########## cleaning the probe files off the server"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f ~/education.rmmann.co.uk/probe-php.php ~/education.rmmann.co.uk/probe-router.php ~/education.rmmann.co.uk/.htaccess && echo removed"
