name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Lint and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          php -v | head -1
          find php -name '*.php' -print0 | xargs -0 -n1 php -l

      # Boots the service and walks the full connector handshake — dynamic
      # client registration, PKCE, token exchange, refresh rotation — then
      # calls every MCP tool, including the refusals the schema is meant to
      # enforce. This is the check that has to stay green.
      - name: Smoke test
        run: bash deploy/smoke-test.sh
